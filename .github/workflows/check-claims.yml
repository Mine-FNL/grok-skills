name: claims
# Phrase tripwire over *.md. Green means none of the banned strings matched,
# not "no unproven claims in this repo."
on:
  push:
  pull_request:
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-claims.mjs
